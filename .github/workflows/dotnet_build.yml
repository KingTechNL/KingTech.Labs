name: .NET build pipeline

# Triggers
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

#: Jobs to execute
jobs:
  ## Build DockerFileCopy image
  build-dockerfilecopy:
    runs-on: ubuntu-latest

    steps:
    ### Checkout repo
    - uses: actions/checkout@v3
      with: 
        fetch-depth: 0
    ### Generate version number
    - name: Get version
      id: get_version
      uses: kingtechnl/githubactions/gitversion@main

    ### Build docusaurus site
    - name: Build docusaurus site
      uses: kingtechnl/githubactions/docusaurus/build@docusaurus
      with:
        sourceDir: ''
        targetDir: publish
        siteName: 'KingTech Labs'

    ### Deploy to GitHub Pages
    - name: Deploy to GitHub Pages
      uses: kingtechnl/githubactions/deploy-pages@docusaurus
      with:
        sourceDir: publish
        targetBranch: gh-pages
        commitMessage: "Deploy site github actions"
        userName: github-actions
        userEmail: github-actions@users.noreply.github.com
        token: ${{ secrets.GITHUB_TOKEN }}
    